<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторія Екоблогера</title>
    <!-- Підключення стилів Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення іконок Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-green-50 text-gray-800 font-sans min-h-screen p-4">

<div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-4">
    
    <!-- Хедер -->
    <div class="bg-green-600 p-6 text-white text-center">
        <div class="flex justify-center mb-2">
            <i data-lucide="leaf" class="w-10 h-10"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">Лабораторія Екоблогера</h1>
        <p class="text-green-100">Оберіть своє ідеальне обладнання для зйомки без шкоди для природи та бюджету</p>
    </div>

    <!-- Вкладки навігації -->
    <div class="flex border-b border-gray-200">
        <button id="tab-builder" onclick="switchTab('builder')" class="flex-1 py-4 font-semibold text-lg transition-colors text-green-600 border-b-4 border-green-600 bg-green-50">
            Конструктор набору
        </button>
        <button id="tab-simulator" onclick="switchTab('simulator')" class="flex-1 py-4 font-semibold text-lg transition-colors text-gray-500 hover:bg-gray-50">
            Симулятор місій
        </button>
    </div>

    <div class="p-6" id="app-content">
        <!-- Сюди буде підвантажуватись контент через JS -->
    </div>
</div>

<script>
// --- ДАНІ ДОДАТКУ ---
const EQUIPMENT = {
    camera: [
        { id: 'c1', name: 'Власний смартфон', cost: 0, weight: 200, mobility: 10, icon: 'smartphone' },
        { id: 'c2', name: 'Новий смартфон', cost: 250, weight: 190, mobility: 10, icon: 'smartphone' },
        { id: 'c3', name: 'Екшн-камера', cost: 300, weight: 150, mobility: 10, icon: 'video' },
        { id: 'c4', name: 'Бездзеркальна камера', cost: 800, weight: 700, mobility: 4, icon: 'camera' },
    ],
    audio: [
        { id: 'a1', name: 'Вбудований мікрофон', cost: 0, weight: 0, mobility: 10, icon: 'mic' },
        { id: 'a2', name: 'Дротова петличка', cost: 20, weight: 50, mobility: 8, icon: 'mic' },
        { id: 'a3', name: 'Бездротова система', cost: 100, weight: 100, mobility: 9, icon: 'zap' },
    ],
    stabilization: [
        { id: 's1', name: 'Зйомка з рук', cost: 0, weight: 0, mobility: 10, icon: 'briefcase' },
        { id: 's2', name: 'Міні-штатив', cost: 15, weight: 250, mobility: 8, icon: 'camera' },
        { id: 's3', name: 'Великий штатив', cost: 40, weight: 1200, mobility: 3, icon: 'briefcase' },
        { id: 's4', name: 'Електронний стаб', cost: 120, weight: 500, mobility: 6, icon: 'zap' },
    ]
};

const MISSIONS = [
    {
        title: "Інтерв'ю з екологом у приміщенні",
        description: "Вам потрібно записати розмову з експертом. Важливо, щоб картинка не тремтіла, а голос було чітко чути без луни.",
        options: [
            { id: 1, text: 'Екшн-камера + вбудований звук', correct: false, feedback: 'Неправильно. Екшн-камера спотворить обличчя, а звук збере луну з кімнати.' },
            { id: 2, text: 'Смартфон на штативі + радіопетличка', correct: true, feedback: 'Блискучо! Штатив дасть стабільну картинку, а петличка забезпечить ідеальний звук.' },
            { id: 3, text: 'Дзеркальна камера в руках без штатива', correct: false, feedback: 'Неправильно. Зйомка з рук призведе до тремтіння кадру.' }
        ]
    },
    {
        title: "Репортаж на вітряному полігоні",
        description: "Ви на відкритій місцевості, дме сильний вітер. Вам потрібно показувати процеси і коментувати їх на ходу.",
        options: [
            { id: 1, text: 'Смартфон з мікрофоном + хутряний вітрозахист', correct: true, feedback: 'Чудовий вибір! Вітрозахист врятує звук від вітру.' },
            { id: 2, text: 'Телефон + звук з навушників AirPods', correct: false, feedback: 'Неправильно. Навушники не мають вітрозахисту, вітер заглушить голос.' },
            { id: 3, text: 'Велика камера зі студійним мікрофоном', correct: false, feedback: 'Неправильно. Ви не зможете вільно пересуватися, обладнання важке.' }
        ]
    },
    {
        title: "Сплав на байдарках: чистота річки",
        description: "Динамічна зйомка на воді. Руки зайняті веслами, є ризик намочити техніку.",
        options: [
            { id: 1, text: 'Дорогий смартфон на селфі-палиці', correct: false, feedback: 'Небезпечно! Без аквабокса телефон може впасти у воду.' },
            { id: 2, text: 'Професійна відеокамера', correct: false, feedback: 'Абсолютно не підходить. Камера важка і боїться води.' },
            { id: 3, text: 'Водонепроникна екшн-камера на грудях', correct: true, feedback: 'Ідеально! Руки вільні, камера захищена, глядачі бачать все від першої особи.' }
        ]
    }
];

// --- СТАН ДОДАТКУ ---
let state = {
    tab: 'builder',
    builder: { camera: 'c1', audio: 'a1', stabilization: 's1' },
    sim: { index: 0, score: 0, selectedOptId: null }
};

// --- ОСНОВНІ ФУНКЦІЇ ВІДОБРАЖЕННЯ ---
function switchTab(tabName) {
    state.tab = tabName;
    document.getElementById('tab-builder').className = `flex-1 py-4 font-semibold text-lg transition-colors ${tabName === 'builder' ? 'text-green-600 border-b-4 border-green-600 bg-green-50' : 'text-gray-500 hover:bg-gray-50'}`;
    document.getElementById('tab-simulator').className = `flex-1 py-4 font-semibold text-lg transition-colors ${tabName === 'simulator' ? 'text-green-600 border-b-4 border-green-600 bg-green-50' : 'text-gray-500 hover:bg-gray-50'}`;
    render();
}

function render() {
    const content = document.getElementById('app-content');
    if (state.tab === 'builder') content.innerHTML = renderBuilder();
    else content.innerHTML = renderSimulator();
    lucide.createIcons(); // Оновлюємо іконки
}

// --- КОНСТРУКТОР ---
function setEquipment(category, id) {
    state.builder[category] = id;
    render();
}

function renderBuilder() {
    const cam = EQUIPMENT.camera.find(c => c.id === state.builder.camera);
    const aud = EQUIPMENT.audio.find(a => a.id === state.builder.audio);
    const stab = EQUIPMENT.stabilization.find(s => s.id === state.builder.stabilization);

    const cost = cam.cost + aud.cost + stab.cost;
    const weight = cam.weight + aud.weight + stab.weight;
    const mobility = Math.round((cam.mobility + aud.mobility + stab.mobility) / 3);
    
    let verdict = "Збалансований універсальний набір блогера. 👍";
    if (weight < 500 && mobility >= 8) verdict = "Ідеально для походів та екстремальних зйомок! 🌲";
    else if (cost > 500) verdict = "Професійний набір. Краще підходить для студії. 🎬";

    const renderButtons = (items, category, selectedId) => items.map(item => `
        <button onclick="setEquipment('${category}', '${item.id}')" class="p-3 rounded-lg border-2 text-left transition-all ${selectedId === item.id ? 'border-green-500 bg-green-50' : 'border-gray-200 hover:border-green-300'}">
            <div class="font-semibold text-sm mb-1 flex items-center"><i data-lucide="${item.icon}" class="w-4 h-4 mr-2"></i> ${item.name}</div>
            <div class="text-xs text-gray-500">$${item.cost} | ${item.weight}г</div>
        </button>
    `).join('');

    return `
    <div class="fade-in grid md:grid-cols-3 gap-8">
        <div class="md:col-span-2 space-y-6">
            <div><h3 class="text-lg font-bold flex items-center mb-3"><i data-lucide="video" class="mr-2"></i> 1. Камера</h3>
                <div class="grid grid-cols-2 gap-3">${renderButtons(EQUIPMENT.camera, 'camera', state.builder.camera)}</div></div>
            <div><h3 class="text-lg font-bold flex items-center mb-3"><i data-lucide="mic" class="mr-2"></i> 2. Звук</h3>
                <div class="grid grid-cols-2 gap-3">${renderButtons(EQUIPMENT.audio, 'audio', state.builder.audio)}</div></div>
            <div><h3 class="text-lg font-bold flex items-center mb-3"><i data-lucide="briefcase" class="mr-2"></i> 3. Стабілізація</h3>
                <div class="grid grid-cols-2 gap-3">${renderButtons(EQUIPMENT.stabilization, 'stabilization', state.builder.stabilization)}</div></div>
        </div>
        <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 h-fit sticky top-6">
            <h3 class="text-xl font-bold mb-4 text-center">Ваш набір:</h3>
            <div class="space-y-4 mb-6">
                <div class="flex justify-between pb-2 border-b"><span class="text-gray-600">Бюджет:</span><span class="text-xl font-bold text-green-600">$${cost}</span></div>
                <div class="flex justify-between pb-2 border-b"><span class="text-gray-600">Вага:</span><span class="text-xl font-bold text-gray-800">${weight} г</span></div>
                <div class="flex justify-between pb-2 border-b"><span class="text-gray-600">Мобільність:</span><span class="text-xl font-bold text-blue-600">${mobility} / 10</span></div>
            </div>
            <div class="bg-white p-3 rounded-lg border border-green-100 text-center text-sm font-medium">${verdict}</div>
        </div>
    </div>`;
}

// --- СИМУЛЯТОР ---
function selectSimOption(optId, isCorrect) {
    if (state.sim.selectedOptId !== null) return;
    state.sim.selectedOptId = optId;
    if (isCorrect) state.sim.score++;
    render();
}

function nextMission() {
    state.sim.index++;
    state.sim.selectedOptId = null;
    render();
}

function restartSim() {
    state.sim.index = 0;
    state.sim.score = 0;
    state.sim.selectedOptId = null;
    render();
}

function renderSimulator() {
    if (state.sim.index >= MISSIONS.length) {
        return `
        <div class="fade-in text-center py-10 max-w-xl mx-auto">
            <i data-lucide="award" class="w-20 h-20 text-yellow-500 mx-auto mb-4"></i>
            <h2 class="text-3xl font-bold mb-2">Симулятор завершено!</h2>
            <p class="text-xl mb-6">Ви набрали ${state.sim.score} з ${MISSIONS.length} балів.</p>
            <p class="text-gray-600 mb-8">${state.sim.score === MISSIONS.length ? "Ви справжній експерт!" : "Гарна спроба! Спробуйте ще раз."}</p>
            <button onclick="restartSim()" class="bg-green-600 text-white font-bold py-3 px-8 rounded-full hover:bg-green-700">Спробувати ще раз</button>
        </div>`;
    }

    const mission = MISSIONS[state.sim.index];
    const optsHtml = mission.options.map(opt => {
        let btnClass = "border-gray-200 hover:border-green-500 hover:bg-green-50";
        if (state.sim.selectedOptId === opt.id) {
            btnClass = opt.correct ? "border-green-500 bg-green-100" : "border-red-500 bg-red-50";
        } else if (state.sim.selectedOptId !== null && opt.correct) {
            btnClass = "border-green-500 bg-green-50 opacity-70";
        }
        
        return `
        <button onclick="selectSimOption(${opt.id}, ${opt.correct})" class="w-full p-4 rounded-xl border-2 text-left font-medium transition-all flex justify-between ${btnClass}">
            <span>${opt.text}</span>
            ${state.sim.selectedOptId === opt.id ? (opt.correct ? '<i data-lucide="check-circle-2" class="text-green-600"></i>' : '<i data-lucide="x-circle" class="text-red-600"></i>') : ''}
        </button>`;
    }).join('');

    let feedbackHtml = '';
    if (state.sim.selectedOptId !== null) {
        const selectedOpt = mission.options.find(o => o.id === state.sim.selectedOptId);
        feedbackHtml = `
        <div class="mt-6 p-4 rounded-lg flex items-start ${selectedOpt.correct ? 'bg-green-50 text-green-900 border-green-200' : 'bg-red-50 text-red-900 border-red-200'} border">
            <div class="mr-3 mt-1"><i data-lucide="${selectedOpt.correct ? 'check-circle-2' : 'x-circle'}" class="${selectedOpt.correct ? 'text-green-600' : 'text-red-600'}"></i></div>
            <div>
                <h4 class="font-bold mb-1">${selectedOpt.correct ? 'Правильно!' : 'Помилка!'}</h4>
                <p>${selectedOpt.feedback}</p>
                <button onclick="nextMission()" class="mt-4 flex items-center bg-gray-800 text-white px-5 py-2 rounded-lg hover:bg-gray-700">
                    ${state.sim.index === MISSIONS.length - 1 ? 'Завершити' : 'Наступна місія'} <i data-lucide="chevron-right" class="ml-2 w-4 h-4"></i>
                </button>
            </div>
        </div>`;
    }

    return `
    <div class="fade-in max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <span class="bg-green-100 text-green-800 text-sm font-bold px-3 py-1 rounded-full">Місія ${state.sim.index + 1} з ${MISSIONS.length}</span>
            <span class="font-bold flex items-center"><i data-lucide="award" class="w-5 h-5 mr-1 text-yellow-500"></i> Бали: ${state.sim.score}</span>
        </div>
        <h2 class="text-2xl font-bold mb-3">${mission.title}</h2>
        <p class="text-gray-600 mb-6 text-lg">${mission.description}</p>
        <div class="space-y-3">${optsHtml}</div>
        ${feedbackHtml}
    </div>`;
}

// Запуск при завантаженні
render();
</script>
</body>
</html>
